<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You 💓</title>

    <style>
        body {
            background: #ffe6f0;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            padding: 35px 20px;
            width: 85%;
            max-width: 400px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(255, 50, 120, 0.2);
        }

        h1 {
            color: #ff3377;
            font-size: 32px;
        }

        button {
            padding: 12px 30px;
            margin: 12px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .yes {
            background: #ff3377;
            color: white;
        }

        .no {
            background: #eeeeee;
            color: #333333;
        }

        .hidden {
            display: none;
        }

        .message {
            color: #ff3377;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <!-- First Interface -->
    <div class="box" id="home">
        <h1>I Love You 💓</h1>

        <button class="yes" onclick="showPage('yesPage')">
            Yes 💖
        </button>

        <button class="no" onclick="showPage('noPage')">
            No 😝
        </button>
    </div>

    <!-- Yes Interface -->
    <div class="box hidden" id="yesPage">
        <h1 class="message">Love you too 💗🥰</h1>
        <p>💓 💕 💖 💞 💓</p>
    </div>

    <!-- No Interface -->
    <div class="box hidden" id="noPage">
        <h1 class="message">Yes you love mee 😶‍🌫️😝</h1>
        <p>Hehehe 😂💓</p>
    </div>

    <script>
        function showPage(pageId) {
            document.getElementById("home").classList.add("hidden");
            document.getElementById("yesPage").classList.add("hidden");
            document.getElementById("noPage").classList.add("hidden");

            document.getElementById(pageId).classList.remove("hidden");
        }
    </script>

</body>
</html>
